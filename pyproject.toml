[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confidence-referee"
version = "0.1.0"
description = "A reusable confidence-calibration layer for LLM extraction pipelines - generalized from confidence-aware-meeting-intelligence."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scikit-learn",
    "joblib",
    "rapidfuzz",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
