[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confidence-referee"
version = "0.1.0"
description = "A reusable confidence-calibration layer for LLM extraction pipelines - generalized from confidence-aware-meeting-intelligence."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Prathibha Devkar" },
]
keywords = [
    "llm",
    "confidence-calibration",
    "hallucination-detection",
    "trust",
    "information-extraction",
    "machine-learning",
    "nlp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy",
    "scikit-learn",
    "joblib",
    "rapidfuzz",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/PrathibhaDevkar/confidence-referee"
Repository = "https://github.com/PrathibhaDevkar/confidence-referee"
Issues = "https://github.com/PrathibhaDevkar/confidence-referee/issues"

[tool.setuptools.packages.find]
where = ["src"]
